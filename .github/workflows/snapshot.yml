name: Snapshot

# Publish a fresh `0.3.0-SNAPSHOT` to the Central snapshot repository when the development
# line has moved on. The README recommends the snapshot coordinates to first-time callers, so
# a published snapshot that lags the tree makes the quick start fail to compile for anyone who
# follows it; this workflow keeps the lag under a day instead of leaving it until someone
# remembers to push a tag.
#
# The daily schedule is the rate limit -- at most one automatic publish per day -- and the
# gate below skips the run entirely when Central already carries everything on the branch.
#
# This is a separate workflow from `release.yml` on purpose. A tag pushed by a scheduled run
# with the default `GITHUB_TOKEN` does not trigger another workflow run, so a scheduler that
# pushed `v<version>` would publish nothing; running the deploy here avoids both that trap and
# a personal access token. The cost is that the publish steps below repeat `release.yml`'s
# setup -- keep the two in step when the publishing configuration changes.
#
# GitHub disables a scheduled workflow after 60 days without repository activity. If the daily
# run stops, start it by hand from the Actions tab; the first run picks the work back up.
on:
  schedule:
    # 03:17 UTC: an off-minute hour avoids the top-of-the-hour scheduling rush, and 11:17 in
    # the maintainer's UTC+8 day lets the run carry a full working day of commits.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to snapshot; leave empty for the development branch below.
        required: false
        default: ''

env:
  # The branch carrying the `-SNAPSHOT` version. Move it when the development line moves;
  # the gate refuses to publish any version that is not a snapshot.
  DEVELOPMENT_BRANCH: dev/v0.3.0

permissions:
  contents: read

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # `inputs` is empty for the scheduled run, so this falls back to the branch.
          ref: ${{ inputs.ref || env.DEVELOPMENT_BRANCH }}
          fetch-depth: 0

      # The release path's build JDK, for the same reason: the enforcer requires JDK 25 and
      # the artifact still targets Java 8 bytecode.
      - name: Set up build JDK
        uses: actions/setup-java@v5
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # Skip when Central already carries every commit on the branch. Central's own
      # `<lastUpdated>` is the record of what was published -- the `v0.3.0-SNAPSHOT` tag is
      # not maintained by this workflow and no longer marks the published revision.
      #
      # The comparison uses the branch tip's *committer* date, which is when this state of
      # the branch was created: rebase, amend, and squash-pick all move it forward, so a
      # rewritten branch is republished rather than skipped. The known miss is a branch
      # whose tip carries a deliberate older committer date; dispatch the workflow by hand
      # to publish past it.
      - name: Decide whether Central already has this tree
        id: gate
        run: |
          set -euo pipefail

          version="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)"
          group_id="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.groupId)"
          artifact_id="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"

          case "$version" in
            *-SNAPSHOT) ;;
            *)
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "::notice::$version is not a snapshot version, so there is no snapshot line to publish."
              exit 0
              ;;
          esac

          group_path="$(printf '%s' "$group_id" | tr '.' '/')"
          metadata_url="https://central.sonatype.com/repository/maven-snapshots/${group_path}/${artifact_id}/${version}/maven-metadata.xml"
          echo "Reading $metadata_url"

          last_updated=""
          if metadata="$(curl -fsS --max-time 30 "$metadata_url")"; then
            last_updated="$(printf '%s' "$metadata" | grep -o '<lastUpdated>[0-9]\{14\}' | grep -o '[0-9]\{14\}' | head -1 || true)"
          fi

          if [ -z "$last_updated" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Central serves no $version yet; publishing."
            exit 0
          fi

          # Central writes lastUpdated as UTC yyyyMMddHHmmss, and the branch tip's committer
          # date is rendered in the same shape, so the two compare as plain integers: no date
          # arithmetic, and no dependency on a GNU-specific `date -d`.
          head_stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"

          echo "Branch tip committed: $head_stamp (UTC)"
          echo "Central last updated: $last_updated (UTC)"

          if [ "$head_stamp" -gt "$last_updated" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::The branch tip is newer than the published snapshot; publishing."
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Central already carries every commit on the branch; nothing to publish."
          fi

      # A snapshot is still a public artifact, and the development branch has no continuous
      # test run of its own (`ci.yml` runs on `main` and on pull requests), so verify before
      # deploying rather than after.
      - name: Verify the library and the demo
        if: steps.gate.outputs.publish == 'yes'
        run: |
          LIBRARY_VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mvn -B -ntp clean install
          mvn -B -ntp -f demo/pom.xml -Dparallel-in-scope.version="$LIBRARY_VERSION" package

      - name: Publish the snapshot to Maven Central
        if: steps.gate.outputs.publish == 'yes'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy

      - name: Summarize
        if: always()
        env:
          PUBLISHED: ${{ steps.gate.outputs.publish }}
        run: |
          case "$PUBLISHED" in
            yes) echo "Published a snapshot from $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY" ;;
            no) echo "No snapshot published: Central already carries every commit on the branch." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "No snapshot published: the gate did not reach a decision; check the log above." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
