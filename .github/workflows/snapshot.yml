name: Snapshot

# Publish `0.4.0-SNAPSHOT` when the development line has moved past Central's
# last publication in UTC days, preserving the previous development line's policy.
#
# Three triggers share that one gate. `push` publishes a moved line immediately; the daily
# `schedule` republishes a tip whose publish never reached Central -- a failed deploy or a
# lost run -- without waiting for the next push; `workflow_dispatch` is the manual fallback.
# A run that finds nothing newer than Central publishes nothing. The UTC-day rate limit binds
# every trigger alike: a tip committed on an already-published UTC day never satisfies the
# gate on a later day either, so a same-day second push waits for a later-dated commit (whose
# publish contains it) or for the `v0.4.0-SNAPSHOT` tag.
#
# GitHub fires `schedule` (and offers `workflow_dispatch` in the Actions UI) only from the
# default branch's copy of this file; a `schedule` in a copy that exists only on a development
# branch never fires. This branch's copy is the definition, and the default branch's copy is a
# sync of it: syncing that copy is a maintainer action outside the development line, and until
# it happens the schedule stays dormant. The job pins its checkout to this branch below, so
# wherever a run starts from, it publishes this development line. Pushing the `v0.4.0-SNAPSHOT`
# tag (handled by `release.yml`, already on the default branch) remains the way to publish by
# hand that bypasses the date gate.
on:
  push:
    branches: [dev/v0.4.0]
  # 02:17 UTC daily. Off the top of the hour because GitHub delays scheduled workflows the
  # most around popular cron minutes; the gate makes the exact minute uncritical.
  schedule:
    - cron: '17 2 * * *'
  # Manual runs still gate on the same UTC-day rule, so pressing the button twice in a day
  # publishes once -- for a same-day republication that skips the gate, push the
  # `v0.4.0-SNAPSHOT` tag by hand.
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishes. `cancel-in-progress` stays false so that a push arriving mid-deploy
# cannot kill a publish that has already started.
concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Pin the branch: scheduled and UI-dispatched runs execute the default branch's copy of
      # this file, and the pin is what makes them build this development line instead of the
      # default branch's tree. For push runs the pinned ref is the pushed branch itself.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev/v0.4.0

      # The release path's build JDK, for the same reason: the enforcer requires JDK 25 and
      # the artifact still targets Java 8 bytecode.
      - name: Set up build JDK
        uses: actions/setup-java@v6
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      # Skip unless the branch has moved past what Central serves. Central's own
      # `<lastUpdated>` is the record of the last publish -- the snapshot tag is no
      # longer maintained as a marker of the published revision.
      #
      # Both stamps are UTC `yyyyMMddHHmmss`, so they compare as plain integers: no date
      # arithmetic, and no dependency on a GNU-specific `date -d`. Requiring the branch tip's
      # UTC *date* to be strictly later than the last publish's UTC date is the rate limit --
      # once a publish has happened, no further push can publish again until the next UTC day.
      #
      # The comparison reads the branch tip's committer date, which rebase, amend, and
      # squash-pick all move forward, so a rewritten branch is republished rather than
      # skipped. The known miss is a branch whose tip carries a deliberately older committer
      # date; pushing the matching snapshot tag publishes past it.
      - name: Decide whether Central already has this tree
        id: gate
        run: |
          set -euo pipefail

          version="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.version)"
          group_id="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.groupId)"
          artifact_id="$(mvn -B -ntp -q -DforceStdout help:evaluate -Dexpression=project.artifactId)"

          case "$version" in
            *-SNAPSHOT) ;;
            *)
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "::notice::$version is not a snapshot version, so there is no snapshot line to publish."
              exit 0
              ;;
          esac

          group_path="$(printf '%s' "$group_id" | tr '.' '/')"
          metadata_url="https://central.sonatype.com/repository/maven-snapshots/${group_path}/${artifact_id}/${version}/maven-metadata.xml"
          echo "Reading $metadata_url"

          last_updated=""
          if metadata="$(curl -fsS --max-time 30 "$metadata_url")"; then
            last_updated="$(printf '%s' "$metadata" | grep -o '<lastUpdated>[0-9]\{14\}' | grep -o '[0-9]\{14\}' | head -1 || true)"
          fi

          if [ -z "$last_updated" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Central serves no $version yet; publishing."
            exit 0
          fi

          head_stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          head_day="${head_stamp:0:8}"
          published_day="${last_updated:0:8}"

          echo "Branch tip committed: $head_stamp (UTC)"
          echo "Central last updated: $last_updated (UTC)"

          if [ "$head_day" -gt "$published_day" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::The branch has moved past the published snapshot; publishing."
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to publish: the published snapshot is not older than the branch tip in UTC days."
          fi

      # A snapshot is still a public artifact, and the development branch has no continuous
      # test run of its own (`ci.yml` runs on `main` and on pull requests), so verify before
      # deploying rather than after.
      - name: Verify the library and the demo
        if: steps.gate.outputs.publish == 'yes'
        run: |
          LIBRARY_VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mvn -B -ntp clean install
          mvn -B -ntp -f demo/pom.xml -Dparallel-in-scope.version="$LIBRARY_VERSION" package

      # `maven.repository.credentialScope=id` restores credential matching by server id. The
      # runner image's Maven scopes credentials by repository origin, and the `central` server
      # that `setup-java` writes into settings.xml is associated with the super-POM's
      # `https://repo.maven.apache.org` -- so the Central *snapshot* endpoint,
      # `https://central.sonatype.com/repository/maven-snapshots/`, is refused the credentials
      # and answers 401. Without this flag the deploy fails before uploading anything. Maven
      # names this switch in the warning it prints. `release.yml` runs the same command and
      # needs the same treatment once this reaches the default branch.
      - name: Publish the snapshot to Maven Central
        id: deploy
        if: steps.gate.outputs.publish == 'yes'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn -B -ntp -Prelease -DskipTests
          -Dmaven.repository.credentialScope=id
          deploy

      - name: Summarize
        if: always()
        env:
          PUBLISH_DECISION: ${{ steps.gate.outputs.publish }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          case "$PUBLISH_DECISION:$DEPLOY_OUTCOME" in
            yes:success) echo "Published a snapshot from $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY" ;;
            yes:*) echo "No successful snapshot deployment: deploy outcome was ${DEPLOY_OUTCOME:-unavailable}; check the log above." >> "$GITHUB_STEP_SUMMARY" ;;
            no:*) echo "No snapshot published: the gate skipped publication." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "No snapshot published: the gate did not reach a decision; check the log above." >> "$GITHUB_STEP_SUMMARY" ;;
          esac
