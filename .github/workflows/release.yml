name: Release

on:
  push:
    tags:
      # Release and snapshot tags alike: the tag must equal `v` plus the Maven version,
      # and the verification step below rejects any tag that does not match.
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
        default: v0.4.0

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# `contents: write` is only needed by the final step, which publishes the GitHub release for a
# release tag. Snapshot tags deploy to Central but deliberately do not create a release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r mkdocs/requirements.txt

      - name: Run documentation and design gates
        run: |
          python3 scripts/check-english-docs.py
          python3 scripts/check-local-links.py
          python3 scripts/check-design-routes.py
          python3 scripts/check-doc-refs.py
          python3 scripts/check-demo-articles.py
          mkdocs build --strict --config-file mkdocs/mkdocs.yml

      - name: Set up Maven 3.9.11
        env:
          MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maven.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz
          echo "$MAVEN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      # Build JDK: release builds run the same enforcer as CI, which requires JDK 25; the
      # published artifact still targets release 8 bytecode.
      - name: Set up build JDK
        uses: actions/setup-java@v6
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify the tag matches the Maven version
        run: |
          mvn --version
          MAVEN_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "v${MAVEN_VERSION}" = "$RELEASE_TAG"

      - name: Verify library and demo
        run: |
          LIBRARY_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mvn -B -ntp spotless:check
          mvn -B -ntp clean install
          mvn -B -ntp -f demo/pom.xml spotless:check
          mvn -B -ntp -f demo/pom.xml -Dparallel-in-scope.version="$LIBRARY_VERSION" package

      - name: Set up Java 8 runtime
        uses: actions/setup-java@v6
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Verify Java 8 consumers
        env:
          LIBRARY_VERSION: 0.4.0
        run: |
          MAVEN_BASEDIR="$GITHUB_WORKSPACE/verification/maven-central-consumer" \
            mvn -B -ntp -f verification/maven-central-consumer \
            -Dparallel-in-scope.version="$LIBRARY_VERSION" clean test
          MAVEN_BASEDIR="$GITHUB_WORKSPACE/demo" \
            mvn -B -ntp -f demo \
            -Dparallel-in-scope.version="$LIBRARY_VERSION" test

      # `maven.repository.credentialScope=id` restores credential matching by server id. The
      # runner image's Maven scopes credentials by repository origin, and the `central` server
      # that `setup-java` writes into settings.xml is associated with the super-POM's
      # `https://repo.maven.apache.org`, so the Central snapshot endpoint is refused the
      # credentials and answers 401 -- this command failed that way in `snapshot.yml` on
      # 2026-10-09 after the image's Maven was updated. Maven names this switch in its warning.
      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn -B -ntp -Prelease -DskipTests
          -Dmaven.repository.credentialScope=id
          deploy

      - name: Create GitHub release
        if: ${{ !contains(env.RELEASE_TAG, '-SNAPSHOT') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
