name: Release

on:
  push:
    tags:
      # Release and snapshot tags alike: the tag must equal `v` plus the Maven version,
      # and the verification step below rejects any tag that does not match.
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify the tag matches the Maven version
        run: |
          MAVEN_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "v${MAVEN_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Verify library and demo
        run: |
          mvn -B -ntp clean install
          mvn -B -ntp -f demo/pom.xml package

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy
