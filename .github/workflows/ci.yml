name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r mkdocs/requirements.txt

      - name: Check English documentation language
        run: python3 scripts/check-english-docs.py

      - name: Check local documentation links
        run: python3 scripts/check-local-links.py

      - name: Build documentation strictly
        run: mkdocs build --strict --config-file mkdocs/mkdocs.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Build JDKs, not runtime JDKs: Error Prone and NullAway require 21+ to run, and the
        # enforcer rejects an older build JDK outright. The bytecode target is unaffected --
        # the library stays at release 8 and the tests at release 11.
        java-version: [ 21, 25 ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up build JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Build and test library on build JDK ${{ matrix.java-version }}
        run: mvn -B -ntp clean install

      - name: Build demo on build JDK ${{ matrix.java-version }}
        run: mvn -B -ntp -f demo/pom.xml package

  java8-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      # Two different JDKs on purpose: the library is built by a JDK that Error Prone/NullAway
      # support, and the JDK 8 runtime below only exercises the resulting artifact.
      - name: Set up build JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build the Java 8 library artifact with the build JDK
        run: |
          echo "LIBRARY_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_ENV"
          mvn -B -ntp -Dmaven.test.skip=true -Dmaven.javadoc.skip=true clean install

      - name: Set up Java 8 runtime
        uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: temurin
          cache: maven

      - name: Run the public API consumer on the Java 8 runtime
        run: >-
          mvn -B -ntp
          -f verification/maven-central-consumer/pom.xml
          -Dparallel-in-scope.version="$LIBRARY_VERSION"
          clean test
